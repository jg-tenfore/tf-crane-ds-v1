name: Deploy Storybook

# Publishes Storybook to https://jg-tenfore.github.io/tf-crane-ds-v1/ on every push to main.

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: "22"
                  cache: npm

            - run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Build Storybook
              # PAGES=1 sets Vite's base to /tf-crane-ds-v1/ (see .storybook/main.ts).
              run: PAGES=1 npm run build-storybook -- -o dist

            - uses: actions/upload-pages-artifact@v4
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
